{% load dictionary %}
{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static '/css/style.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link rel="icon" type="image/x-icon" href="{% static '/components/icon.svg' %}">
</head>
<body class="container mt-5">
    {% include 'header.html' %}
    <div class="row">
        <div class="col-sm-6">
            <div id="tree-container" style="background-color: #f9f9f9; border-radius: 35px;"></div>
            {{ tree_data|json_script:"my-data-json" }}
        </div>
        <div class="col-sm-1"></div>
        <div class="col-sm-5"style="display: flex; justify-content: center; align-items: center;">
            <div class="row">
                <div class="col-sm-12" >
                    <div id="pieChart" style="background-color: #f9f9f9; border-radius: 35px; padding: 20px;"></div>
                    {{ pie_data|json_script:"pie_data" }}
                </div>
            </div>
        </div>
    </div>
    <br>
    <div class="row">
        <div class="col-sm-12">
            <div id="charts" style="background-color: #f9f9f9; border-radius: 35px; padding: 20px;">
                <div id="doxy"></div>
                <div id="nondoxy"></div>
                {{ data|json_script:"data"}}
            </div>
        </div>
    </div>
    <script src="{% static 'javascript/charts/tree.js' %}"></script>
    <script src="{% static 'javascript/charts/piechart.js' %}"></script>
    <script src="{% static 'javascript/charts/syncingchart.js' %}"></script>
</body>
</html>
